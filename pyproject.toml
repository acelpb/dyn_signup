[project]
name = "dyn-signup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django-bootstrap4>=26.3",
    "django>=6.1.3",
    "django-crispy-forms>=2.7",
    "django-import-export[xlsx]>=4.4.5",
    "django-magiclink>=1.4.0,<2",
    "django-object-actions>=5.1.2",
    "django-tables2>=3.0.1",
    "gunicorn>=26.2.0,<27",
    "ovh~=1.2",
    "python-decouple>=3.8",
    "tablib~=3.10",
    "whitenoise>=6.8.2",
    "django-phonenumber-field[phonenumbers]>=8.5.0,<9",
    "schwifty>=2026.11.2",
    "crispy-bootstrap5>=2026.9",
    "django-sass-processor>=1.4.2",
    "django-compressor>=4.7.0",
]

[dependency-groups]
dev = [
    "model-bakery>=1.24.2",
    "pytest-bdd>=9.0.1",
    "pytest-django>=4.14.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "pytest-selenium>=4.1.0",
    "webdriver-manager>=4.0.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.7.0",
    "django-debug-toolbar>=8.0.0",
    "libsass>=0.23.0",
    "pytest-watch>=4.2.0",
    "pytest-xdist>=3.8.0",
    "pytest-randomly>=5.1.0",
    "pytest-rerunfailures>=16.7",
    "pytest-django-queries>=1.3.0",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
# Pin the pre-0.17 default rule set; ruff 0.17 widened its defaults.
select = ["E4", "E7", "E9", "F"]
extend-select = ["I", "B", "Q"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dynasignup.settings"
bdd_features_base_dir = "tests/features/"
FAIL_INVALID_TEMPLATE_VARS = true
django_debug_mode = false
addopts = "--reuse-db --driver Chrome --cov-report=term --cov=."

[tool.coverage.run]
source = [
    "accounts/",
    "dynasignup/",
    "newsletter/",
    "reunion/",
    "signup2023/",
    "signup2026/",
]

omit = [
    "*/migrations/*",
    "tests/*",
]

[tool.uv]
# Hold transitive major releases younger than 30 days (as of 2026-11-15).
constraint-dependencies = [
    "gherkin-official<43",
    "soupsieve<4",
    "watchdog<7",
]
